<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:url('background.jpg') center/cover no-repeat;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* ===== BOUTON RÉOUVERTURE ===== */
.open-app{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    padding:16px 20px;
    border-radius:14px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);

    color:white;
    cursor:pointer;

    backdrop-filter:blur(14px);
    text-align:center;

    display:none;
    font-size:14px;
}

.open-app.show{
    display:block;
}

.open-app:hover{
    background:rgba(255,0,0,0.25);
}

/* ===== FENÊTRE ===== */
.window{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:900px;
    max-width:95vw;
    height:600px;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:18px;

    box-shadow:0 30px 100px rgba(0,0,0,0.75);

    overflow:hidden;

    transition:0.25s ease;
}

/* maximisé */
.window.maximized{
    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    transform:none;

    border-radius:0;
}

/* minimisé */
.window.minimized{
    height:44px;
    overflow:hidden;
}

/* fermé */
.window.closed{
    display:none;
}

/* ===== BARRE ===== */
.titlebar{
    height:46px; /* légèrement plus harmonieux pour grande fenêtre */

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 18px;

    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);

    cursor:default;
    user-select:none;
}

/* titre plus visible */
.titlebar div{
    color:white;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.3px;
}

/* ===== BOUTONS AJUSTÉS ===== */
.controls{
    display:flex;
    gap:10px; /* plus d’air pour grande fenêtre */
}

/* boutons un peu plus visibles */
.btn{
    width:13px;
    height:13px;
    border-radius:50%;

    cursor:pointer;

    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.20);

    backdrop-filter:blur(10px);

    transition:0.2s;
}

/* effet hover global */
.btn:hover{
    transform:scale(1.25);
}

/* close */
.close:hover{
    background:rgba(255,80,80,0.30);
    border-color:rgba(255,80,80,0.7);
    box-shadow:0 0 14px rgba(255,0,0,0.4);
}

/* min */
.min:hover{
    background:rgba(255,190,80,0.25);
    border-color:rgba(255,190,80,0.6);
    box-shadow:0 0 12px rgba(255,180,80,0.3);
}

/* max */
.max:hover{
    background:rgba(80,255,140,0.22);
    border-color:rgba(80,255,140,0.6);
    box-shadow:0 0 12px rgba(80,255,140,0.3);
}

/* ===== CONTENU ===== */
.content{
    padding:40px;
    text-align:center;
    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}

.pp{
    width:140px;
    height:140px;
    border-radius:18px;
    object-fit:cover;
}

.name{
    font-size:42px;
    font-weight:900;
}

.links{
    width:100%;
    max-width:420px;

    display:flex;
    flex-direction:column;
    gap:14px;
}

.link{
    text-decoration:none;
    color:white;

    padding:16px;
    border-radius:14px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(10px);

    transition:0.2s;
    font-size:16px;
    font-weight:600;
}

.link:hover{
    background:rgba(255,0,0,0.25);
    border-color:rgba(255,0,0,0.4);
    transform:scale(1.02);
}
</style>
</head>

<body>

<div class="open-app" id="openBtn" onclick="openWindow()">
    Cliquez ici pour faire réapparaître la fenêtre
</div>

<div class="window" id="window">

    <div class="titlebar">

        <div>Mes liens</div>

        <div class="controls">
            <div class="btn min" onclick="minimizeWindow()"></div>
            <div class="btn max" onclick="maximizeWindow()"></div>
            <div class="btn close" onclick="closeWindow()"></div>
        </div>

    </div>

    <div class="content">

        <img src="pp.jpg" class="pp">
        <div class="name">ReYz</div>

        <div class="links">
            <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
            <a class="link" href="https://www.twitch.tv/reyzqtn/" target="_blank">Twitch</a>
            <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
            <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>
        </div>

    </div>

</div>

<script>

const win = document.getElementById("window");
const openBtn = document.getElementById("openBtn");

function openWindow(){
    win.classList.remove("closed");
    openBtn.classList.remove("show");
}

function closeWindow(){
    win.classList.add("closed");
    openBtn.classList.add("show");
}

function minimizeWindow(){
    win.classList.toggle("minimized");
}

function maximizeWindow(){
    win.classList.toggle("maximized");
}

</script>

</body>
</html>
