body{

.window{

    background:#d8dee9;
    border-radius:6px;
    border:2px solid #7b8ca5;
    text-decoration:none;
    color:#000080;
    font-size:20px;
    box-shadow:0 3px 0 #6d7f99;
}

.link:hover{
    background:#e7edf7;
}

.dots{
    position:absolute;
    right:20px;
    color:black;
