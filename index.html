<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReYz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background-image:url('background.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}

.container{
    position:relative;
    z-index:2;

    width:90%;
    max-width:500px;

    display:flex;
    flex-direction:column;
    gap:20px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h1{
    color:white;
    font-size:64px;
    font-weight:900;

    text-shadow:
    0 0 10px #b84cff,
    0 0 20px #7d2cff,
    4px 4px 0 black;
}

.link{
    text-decoration:none;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);

    border:2px solid rgba(255,255,255,0.2);

    color:white;

    padding:18px;
    border-radius:18px;

    text-align:center;

    font-size:22px;
    font-weight:bold;

    transition:0.2s;
}

.link:hover{
    transform:scale(1.03);

    background:rgba(173,73,255,0.35);

    border-color:#c46fff;

    box-shadow:
    0 0 15px #a855f7,
    0 0 30px rgba(168,85,247,0.5);
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

<div class="logo">
<h1>ReYz</h1>
</div>

<a class="link" href="https://letterboxd.com/" target="_blank">
Letterboxd
</a>

<a class="link" href="https://twitch.tv/" target="_blank">
Twitch
</a>

<a class="link" href="https://discord.gg/" target="_blank">
Discord
</a>

<a class="link" href="https://docs.google.com/" target="_blank">
Google Doc
</a>

</div>

</body>
</html>
