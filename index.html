<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:url('background.jpg') center/cover no-repeat;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* ===== MESSAGE ===== */
.open-app{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:340px;
    padding:18px;

    border-radius:14px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);

    color:white;
    text-align:center;

    backdrop-filter:blur(14px);

    display:none;
}

.open-app.show{
    display:block;
}

.click-here{
    display:inline-block;
    margin-top:8px;

    padding:4px 10px;
    border-radius:8px;

    background:rgba(255,0,0,0.25);
    border:1px solid rgba(255,0,0,0.4);

    cursor:pointer;
    font-weight:800;
}

/* ===== WINDOW (PLUS GRANDE) ===== */
.window{
    position:fixed;

    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:1100px;   /* 🔥 PLUS GRAND */
    height:750px;   /* 🔥 PLUS GRAND */

    max-width:95vw;
    max-height:92vh;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:18px;

    box-shadow:0 30px 100px rgba(0,0,0,0.75);

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

/* fullscreen */
.window.maximized{
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    transform:none !important;

    border-radius:0;
}

/* minimisé */
.window.minimized{
    height:44px;
}

/* fermé */
.window.closed{
    display:none;
}

/* ===== BAR ===== */
.titlebar{
    height:48px; /* 🔥 légèrement ajusté */

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 16px;

    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);

    flex-shrink:0;
}

.titlebar div{
    color:white;
    font-size:14px;
    font-weight:600;
}

/* boutons fenêtre */
.controls{
    display:flex;
    gap:9px;
}

.btn{
    width:12px;
    height:12px;

    border-radius:50%;

    cursor:pointer;

    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.18);

    transition:0.2s;
}

.btn:hover{
    transform:scale(1.2);
}

.close:hover{ background:rgba(255,80,80,0.25); }
.min:hover{ background:rgba(255,190,80,0.20); }
.max:hover{ background:rgba(80,255,140,0.18); }

/* ===== CONTENT ===== */
.content{
    flex:1;

    padding:50px; /* 🔥 plus aéré */

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;

    color:white;

    overflow:hidden;
}

/* scroll uniquement fullscreen */
.window.maximized .content{
    overflow-y:auto;
}

/* avatar */
.pp{
    width:160px;   /* 🔥 ajusté */
    height:160px;
    border-radius:18px;
    object-fit:cover;
}

.name{
    font-size:48px; /* 🔥 plus lisible */
    font-weight:900;
}

/* ===== LINKS ADAPTATIFS ===== */
.links{
    width:100%;
    max-width:650px; /* 🔥 s’adapte mieux à grande fenêtre */

    display:flex;
    flex-direction:column;
    gap:16px;
}

.link{
    width:100%;

    text-decoration:none;
    color:white;

    padding:18px; /* 🔥 un peu plus grand */

    border-radius:14px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);

    font-size:17px;

    text-align:center;

    transition:0.2s;
}

.link:hover{
    background:rgba(255,0,0,0.25);
    border-color:rgba(255,0,0,0.4);
    transform:scale(1.02);
}
</style>
</head>

<body>

<div class="open-app" id="openBtn">
    Bravo tu as cassé le site !<br>
    Clique <span class="click-here" onclick="openWindow()">ICI</span> pour remettre tout en ordre
</div>

<div class="window" id="window">

    <div class="titlebar">

        <div>Mes liens</div>

        <div class="controls">
            <div class="btn" onclick="minimizeWindow()"></div>
            <div class="btn" onclick="maximizeWindow()"></div>
            <div class="btn" onclick="closeWindow()"></div>
        </div>

    </div>

    <div class="content">

        <img src="pp.jpg" class="pp">
        <div class="name">ReYz</div>

        <div class="links">
            <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
            <a class="link" href="https://backloggd.com/u/ReYzQTN/" target="_blank">Backloggd</a>
            <a class="link" href="https://www.twitch.tv/reyzqtn/" target="_blank">Twitch</a>
            <a class="link" href="https://www.youtube.com/@ReYzQTN" target="_blank">YouTube</a>
            <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
            <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>
        </div>

    </div>

</div>

<script>

const win = document.getElementById("window");
const openBtn = document.getElementById("openBtn");

function openWindow(){
    win.classList.remove("closed");
    openBtn.classList.remove("show");
}

function closeWindow(){
    win.classList.add("closed");
    openBtn.classList.add("show");
}

function minimizeWindow(){
    win.classList.toggle("minimized");
}

function maximizeWindow(){
    win.classList.toggle("maximized");
}

</script>

</body>
</html>
