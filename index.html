<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:url('background.jpg') center/cover no-repeat;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* ===== MESSAGE ===== */
.open-app{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:360px;
    padding:18px;
    border-radius:14px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:white;
    text-align:center;
    backdrop-filter:blur(14px);
    display:none;
}

.open-app.show{ display:block; }

.click-here{
    display:inline-block;
    margin-top:8px;
    padding:4px 10px;
    border-radius:8px;
    background:rgba(255,0,0,0.25);
    border:1px solid rgba(255,0,0,0.4);
    cursor:pointer;
    font-weight:800;
}

/* ===== WINDOW ===== */
.window{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:1300px;
    height:850px;

    max-width:96vw;
    max-height:94vh;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:18px;

    box-shadow:0 30px 100px rgba(0,0,0,0.75);

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

/* 🔥 FULLSCREEN FIX (CRITIQUE) */
.window.maximized{
    top:0;
    left:0;
    transform:none !important;
    width:100vw !important;
    height:100vh !important;
    max-width:none !important;
    max-height:none !important;
    border-radius:0 !important;
}

/* ===== BAR ===== */
.titlebar{
    height:50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);
    flex-shrink:0;
}

.titlebar div{
    color:white;
    font-size:14px;
    font-weight:600;
}

/* ===== BUTTONS FIX ===== */
.controls{
    display:flex;
    gap:10px;
}

.btn{
    width:13px;
    height:13px;
    border-radius:50%;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(8px);
    transition:0.25s;
}

/* hover glass colors */
.close:hover{
    background:rgba(255,80,80,0.35);
    box-shadow:0 0 10px rgba(255,80,80,0.4);
}

.min:hover{
    background:rgba(255,200,80,0.35);
    box-shadow:0 0 10px rgba(255,200,80,0.4);
}

.max:hover{
    background:rgba(80,255,140,0.35);
    box-shadow:0 0 10px rgba(80,255,140,0.4);
}

.btn:hover{
    transform:scale(1.2);
}

/* ===== CONTENT ===== */
.content{
    flex:1;
    padding:60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    color:white;

    overflow:hidden;
}

/* scroll uniquement fullscreen */
.window.maximized .content{
    overflow-y:auto;
}

/* avatar */
.pp{
    width:180px;
    height:180px;
    border-radius:20px;
    object-fit:cover;
}

.name{
    font-size:54px;
    font-weight:900;
}

/* ===== LINKS FIX IMPORTANT ===== */
.links{
    width:100%;
    max-width:900px;

    display:flex;
    flex-direction:column;

    gap:18px;

    /* 🔥 IMPORTANT: permet de voir tous les liens */
    padding-bottom:40px;
}

.link{
    width:100%;
    text-decoration:none;
    color:white;

    padding:20px;

    border-radius:14px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);

    font-size:18px;
    font-weight:600;

    text-align:center;

    transition:0.2s;
}

.link:hover{
    background:rgba(255,0,0,0.25);
    border-color:rgba(255,0,0,0.4);
    transform:scale(1.02);
}
</style>
</head>

<body>

<div class="open-app" id="openBtn">
    Bravo tu as cassé le site !<br>
    Clique <span class="click-here" onclick="openWindow()">ICI</span> pour remettre tout en ordre
</div>

<div class="window" id="window">

    <div class="titlebar">
        <div>Mes liens</div>

        <div class="controls">
            <div class="btn close" onclick="closeWindow()"></div>
            <div class="btn min" onclick="minimizeWindow()"></div>
            <div class="btn max" onclick="maximizeWindow()"></div>
        </div>
    </div>

    <div class="content">

        <img src="pp.jpg" class="pp">
        <div class="name">ReYz</div>

        <div class="links">
            <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
            <a class="link" href="https://backloggd.com/u/ReYzQTN/" target="_blank">Backloggd</a>
            <a class="link" href="https://www.twitch.tv/reyzqtn/" target="_blank">Twitch</a>
            <a class="link" href="https://www.youtube.com/@ReYzQTN" target="_blank">YouTube</a>
            <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
            <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>
        </div>

    </div>

</div>

<script>

const win = document.getElementById("window");
const openBtn = document.getElementById("openBtn");

function openWindow(){
    win.classList.remove("closed");
    openBtn.classList.remove("show");
}

function closeWindow(){
    win.classList.add("closed");
    openBtn.classList.add("show");
}

function minimizeWindow(){
    win.classList.toggle("minimized");
}

function maximizeWindow(){
    win.classList.toggle("maximized");
}

</script>

</body>
</html>
