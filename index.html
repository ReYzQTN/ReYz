<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReYz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background-image:url('background.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    overflow:hidden;
}

.overlay{
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        rgba(0,0,0,0.72),
        rgba(20,0,0,0.82)
    );

    backdrop-filter:blur(2px);
}

.container{
    position:relative;
    z-index:2;

    width:90%;
    max-width:420px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:18px;
}

.pp{
    width:130px;
    height:130px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #8b0000;

    box-shadow:
    0 0 25px rgba(255,0,0,0.35),
    0 0 60px rgba(120,0,0,0.5);
}

.name{
    color:white;

    font-size:52px;
    font-weight:900;

    letter-spacing:2px;

    text-shadow:
    0 0 12px rgba(255,0,0,0.45),
    3px 3px 0 black;
}

.links{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:16px;

    margin-top:10px;
}

.link{
    text-decoration:none;

    color:white;

    text-align:center;

    padding:18px;

    border-radius:16px;

    background:rgba(0,0,0,0.45);

    border:1px solid rgba(255,0,0,0.15);

    backdrop-filter:blur(10px);

    font-size:20px;
    font-weight:bold;

    transition:0.25s;
}

.link:hover{

    transform:translateY(-3px) scale(1.02);

    background:rgba(120,0,0,0.45);

    border-color:#ff0000;

    box-shadow:
    0 0 18px rgba(255,0,0,0.4),
    0 0 40px rgba(255,0,0,0.2);
}

.footer{
    margin-top:10px;

    color:rgba(255,255,255,0.35);

    font-size:12px;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

<img src="pp.jpg" class="pp">

<div class="name">ReYz</div>

<div class="links">

<a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">
Letterboxd
</a>

<a class="link" href="https://www.twitch.tv/reyzqtn" target="_blank">
Twitch
</a>

<a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">
Discord
</a>

<a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">
Google Doc
</a>

</div>
    
<div class="footer">
ReYz ©
</div>

</div>

</body>
</html>
