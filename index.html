<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:url('background.jpg') center/cover no-repeat;
}

/* fond sombre */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* ===== FENÊTRE ===== */
.window{
    position:absolute;
    top:120px;
    left:120px;

    width:420px;

    background:rgba(25,25,25,0.78);
    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;

    box-shadow:0 25px 70px rgba(0,0,0,0.7);

    overflow:hidden;
}

/* barre de titre */
.titlebar{
    height:38px;
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 10px;

    background:rgba(0,0,0,0.65);
    cursor:grab;

    user-select:none;
}

/* titre */
.title{
    color:white;
    font-size:13px;
    font-weight:600;
}

/* boutons */
.controls{
    display:flex;
    gap:8px;
}

.btn{
    width:12px;
    height:12px;
    border-radius:50%;
    cursor:pointer;
}

.close{ background:#ff5f57; }
.min{ background:#ffbd2e; }

/* contenu */
.content{
    padding:20px;
    text-align:center;
    color:white;
}

.pp{
    width:110px;
    height:110px;
    border-radius:16px;
    object-fit:cover;
    margin-bottom:10px;
}

.name{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
}

/* liens */
.links{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.link{
    text-decoration:none;
    color:white;

    padding:12px;
    border-radius:10px;

    background:rgba(0,0,0,0.4);
    border:1px solid rgba(255,0,0,0.2);

    transition:0.2s;
}

.link:hover{
    background:rgba(120,0,0,0.5);
    transform:scale(1.02);
}

/* MINIMISÉ */
.window.minimized{
    height:38px;
    overflow:hidden;
}

/* FERMÉ */
.window.closed{
    display:none;
}
</style>
</head>

<body>

<div class="window" id="window">

    <!-- BARRE -->
    <div class="titlebar" id="dragbar">

        <div class="title">🌐 Mes liens</div>

        <div class="controls">
            <div class="btn min" onclick="minimizeWindow()"></div>
            <div class="btn close" onclick="closeWindow()"></div>
        </div>

    </div>

    <!-- CONTENU -->
    <div class="content">

        <img src="pp.jpg" class="pp">
        <div class="name">ReYz</div>

        <div class="links">
            <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
            <a class="link" href="https://www.twitch.tv/reyzqtn" target="_blank">Twitch</a>
            <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
            <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>
        </div>

    </div>

</div>

<script>
/* ===== FERMER ===== */
function closeWindow(){
    document.getElementById("window").classList.add("closed");
}

/* ===== MINIMISER ===== */
function minimizeWindow(){
    document.getElementById("window").classList.toggle("minimized");
}

/* ===== DRAG & DROP ===== */
const windowEl = document.getElementById("window");
const dragbar = document.getElementById("dragbar");

let isDragging = false;
let offsetX, offsetY;

dragbar.addEventListener("mousedown", (e) => {
    isDragging = true;

    offsetX = e.clientX - windowEl.offsetLeft;
    offsetY = e.clientY - windowEl.offsetTop;

    dragbar.style.cursor = "grabbing";
});

document.addEventListener("mousemove", (e) => {
    if(!isDragging) return;

    windowEl.style.left = (e.clientX - offsetX) + "px";
    windowEl.style.top = (e.clientY - offsetY) + "px";
});

document.addEventListener("mouseup", () => {
    isDragging = false;
    dragbar.style.cursor = "grab";
});
</script>

</body>
</html>
