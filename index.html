<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:url('background.jpg') center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.62);
}

/* ===== DESKTOP ===== */

.desktop{
    position:relative;
    z-index:5;
    width:1300px;
    max-width:96vw;
    display:flex;
    flex-direction:column;
    gap:24px;
}

/* ===== WINDOW ===== */

.window{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 100px rgba(0,0,0,0.75);
    display:flex;
    flex-direction:column;
    transition:0.25s;
}

/* états fenêtres */
.window.minimized .content,
.window.minimized .modal-content{
    display:none;
}

.window.maximized{
    position:fixed;
    inset:20px;
    z-index:999;
}

/* ===== TITLEBAR ===== */

.titlebar{
    height:50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);
    flex-shrink:0;
}

.titlebar div{
    color:white;
    font-size:14px;
    font-weight:600;
}

/* ===== BUTTONS ===== */

.controls{
    display:flex;
    gap:10px;
}

.btn{
    width:13px;
    height:13px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    transition:0.2s;
    cursor:pointer;
}

.close:hover{ background:rgba(255,80,80,0.4); }
.min:hover{ background:rgba(255,200,80,0.4); }
.max:hover{ background:rgba(80,255,140,0.4); }

.btn:hover{ transform:scale(1.2); }

/* ===== CONTENT ===== */

.content{
    flex:1;
    padding:40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
    color:white;
}

/* ===== PROFILE ===== */

.pp{
    width:170px;
    height:170px;
    border-radius:20px;
    object-fit:cover;
}

.name{
    font-size:52px;
    font-weight:900;
}

/* ===== LINKS (GRILLE AU LIEU DE SCROLL) ===== */

.links{
    width:100%;
    max-width:900px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
}

.link{
    padding:18px;
    border-radius:14px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
    text-decoration:none;
    text-align:center;
    font-size:16px;
    font-weight:600;
    transition:0.2s;
}

.link:hover{
    background:rgba(255,0,0,0.25);
    border-color:rgba(255,0,0,0.4);
    transform:scale(1.02);
}

/* ===== CRITIQUES ===== */

.review-list{
    width:100%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
}

.review-card{
    padding:22px;
    border-radius:16px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
    cursor:pointer;
    transition:0.2s;
}

.review-card:hover{
    background:rgba(255,0,0,0.25);
    border-color:rgba(255,0,0,0.4);
    transform:scale(1.01);
}

.review-title{
    font-size:24px;
    font-weight:800;
}

.review-meta{
    margin-top:8px;
    color:#ffd95e;
}

/* ===== MODAL ===== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    backdrop-filter:blur(8px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal.show{
    display:flex;
}

.modal-window{
    width:1300px;
    max-width:95vw;
    height:92vh;
    background:rgba(12,12,12,0.96);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.modal-content{
    padding:40px;
    color:white;
    display:flex;
    flex-direction:column;
    gap:30px;
}

/* ===== REVIEW ===== */

.review-text{
    line-height:1.8;
    font-size:16px;
    background:rgba(255,255,255,0.05);
    border-radius:14px;
    padding:25px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.gallery img{
    width:100%;
    border-radius:12px;
}

/* ===== RESPONSIVE ===== */

@media(max-width:900px){
    .name{ font-size:40px; }
}

</style>
</head>

<body>

<div class="desktop">

    <!-- LINKS -->
    <div class="window">
        <div class="titlebar">
            <div>Mes Liens</div>
            <div class="controls">
                <div class="btn close"></div>
                <div class="btn min"></div>
                <div class="btn max"></div>
            </div>
        </div>

        <div class="content">
            <img src="pp.jpg" class="pp">
            <div class="name">ReYz</div>

            <div class="links">
                <a class="link" href="#">Letterboxd</a>
                <a class="link" href="#">Backloggd</a>
                <a class="link" href="#">Twitch</a>
                <a class="link" href="#">YouTube</a>
                <a class="link" href="#">Discord</a>
                <a class="link" href="#">Google Doc</a>
            </div>
        </div>
    </div>

    <!-- CRITIQUES -->
    <div class="window">
        <div class="titlebar">
            <div>Mes Critiques</div>
            <div class="controls">
                <div class="btn close"></div>
                <div class="btn min"></div>
                <div class="btn max"></div>
            </div>
        </div>

        <div class="content">
            <div class="review-list">
                <div class="review-card" onclick="openReview()">
                    <div class="review-title">Magellan</div>
                    <div class="review-meta">★★★★☆</div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- MODAL -->
<div class="modal" id="reviewModal">
    <div class="modal-window">
        <div class="titlebar">
            <div>Critique • Magellan</div>
            <div class="controls">
                <div class="btn close" onclick="closeReview()"></div>
            </div>
        </div>

        <div class="modal-content">
            <div class="review-text">
                Ton texte ici...
            </div>
        </div>
    </div>
</div>

<script>

/* MODAL */
const modal = document.getElementById("reviewModal");

function openReview(){
    modal.classList.add("show");
}

function closeReview(){
    modal.classList.remove("show");
}

/* WINDOW CONTROLS */
document.querySelectorAll(".window").forEach(win => {

    const closeBtn = win.querySelector(".close");
    const minBtn = win.querySelector(".min");
    const maxBtn = win.querySelector(".max");

    if(closeBtn){
        closeBtn.onclick = () => {
            win.style.display = "none";
        }
    }

    if(minBtn){
        minBtn.onclick = () => {
            win.classList.toggle("minimized");
        }
    }

    if(maxBtn){
        maxBtn.onclick = () => {
            win.classList.toggle("maximized");
        }
    }

});

</script>

</body>
</html>
