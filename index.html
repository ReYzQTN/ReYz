<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:url('background.jpg') center/cover no-repeat;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* ===== bouton réouvrir ===== */
.open-app{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    padding:16px 20px;
    border-radius:14px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);

    color:white;
    cursor:pointer;

    backdrop-filter:blur(14px);

    display:none;
    text-align:center;
}

.open-app.show{
    display:block;
}

/* ===== FENÊTRE ===== */
.window{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:900px;
    max-width:95vw;
    height:600px;
    max-height:90vh;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:18px;

    box-shadow:0 30px 100px rgba(0,0,0,0.75);

    overflow:hidden;

    display:flex;
    flex-direction:column;
}

/* FULLSCREEN PROPRE */
.window.maximized{
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    transform:none;
    border-radius:0;
}

/* minimisé */
.window.minimized{
    height:44px;
}

/* fermé */
.window.closed{
    display:none;
}

/* ===== BARRE ===== */
.titlebar{
    height:44px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 14px;

    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);

    flex-shrink:0;
    user-select:none;
}

.titlebar div{
    color:white;
    font-size:13px;
    font-weight:600;
}

/* boutons */
.controls{
    display:flex;
    gap:8px;
}

.btn{
    width:11px;
    height:11px;
    border-radius:50%;

    cursor:pointer;

    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.18);

    transition:0.2s;
}

.btn:hover{
    transform:scale(1.2);
}

/* hover thème */
.close:hover{
    background:rgba(255,80,80,0.25);
    border-color:rgba(255,80,80,0.6);
}

.min:hover{
    background:rgba(255,190,80,0.20);
    border-color:rgba(255,180,80,0.5);
}

.max:hover{
    background:rgba(80,255,140,0.18);
    border-color:rgba(80,255,140,0.5);
}

/* ===== CONTENU (SCROLL ICI) ===== */
.content{
    flex:1;
    overflow-y:auto;   /* 🔥 SCROLL FIXÉ ICI */

    padding:40px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;

    color:white;
    text-align:center;
}

/* scrollbar propre (optionnel) */
.content::-webkit-scrollbar{
    width:6px;
}

.content::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.2);
    border-radius:10px;
}

.pp{
    width:140px;
    height:140px;
    border-radius:18px;
    object-fit:cover;
}

.name{
    font-size:42px;
    font-weight:900;
}

/* ===== LIENS 100% PROPRE ===== */
.links{
    width:100%;
    max-width:520px; /* 🔥 adapté à grande fenêtre */

    display:flex;
    flex-direction:column;
    gap:14px;
}

.link{
    width:100%; /* 🔥 prend toute la largeur du container */

    text-decoration:none;
    color:white;

    padding:16px 18px;

    border-radius:14px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);

    font-size:16px;
    font-weight:600;

    text-align:center;

    transition:0.2s;
}

.link:hover{
    background:rgba(255,0,0,0.25);
    border-color:rgba(255,0,0,0.4);
    transform:scale(1.02);
}
</style>
</head>

<body>

<div class="open-app" id="openBtn" onclick="openWindow()">
    Cliquez ici pour faire réapparaître la fenêtre
</div>

<div class="window" id="window">

    <div class="titlebar">

        <div>Mes liens</div>

        <div class="controls">
            <div class="btn min" onclick="minimizeWindow()"></div>
            <div class="btn max" onclick="maximizeWindow()"></div>
            <div class="btn close" onclick="closeWindow()"></div>
        </div>

    </div>

    <div class="content">

        <img src="pp.jpg" class="pp">
        <div class="name">ReYz</div>

        <div class="links">
            <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
            <a class="link" href="https://www.twitch.tv/reyzqtn/" target="_blank">Twitch</a>
            <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
            <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>
        </div>

    </div>

</div>

<script>

const win = document.getElementById("window");
const openBtn = document.getElementById("openBtn");

function openWindow(){
    win.classList.remove("closed");
    openBtn.classList.remove("show");
}

function closeWindow(){
    win.classList.add("closed");
    openBtn.classList.add("show");
}

function minimizeWindow(){
    win.classList.toggle("minimized");
}

function maximizeWindow(){
    win.classList.toggle("maximized");
}

</script>

</body>
</html>
