<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:url('background.jpg') center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.62);
}

/* ===== DESKTOP ===== */

.desktop{
    position:relative;
    z-index:5;
    width:1300px;
    max-width:96vw;
    display:flex;
    flex-direction:column;
    gap:24px;
}

/* ===== WINDOW ===== */

.window{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* states */
.window.minimized .content{
    display:none;
}

.window.maximized{
    position:fixed;
    inset:20px;
    z-index:999;
}

/* ===== TITLEBAR ===== */

.titlebar{
    height:50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.titlebar div{
    color:white;
    font-size:14px;
    font-weight:600;
}

/* ===== BUTTONS ===== */

.controls{
    display:flex;
    gap:10px;
}

.btn{
    width:13px;
    height:13px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    cursor:pointer;
    transition:0.2s;
}

.btn:hover{
    transform:scale(1.2);
}

.close:hover{ background:rgba(255,80,80,0.4); }
.min:hover{ background:rgba(255,200,80,0.4); }
.max:hover{ background:rgba(80,255,140,0.4); }

/* ===== CONTENT ===== */

.content{
    padding:40px;
    color:white;
}

/* LINKS */

.links{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
}

.link{
    padding:16px;
    text-align:center;
    border-radius:12px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
    text-decoration:none;
}

/* ===== CRITIQUES ===== */

.review-card{
    padding:20px;
    border-radius:14px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    cursor:pointer;
}

/* ===== MODAL ===== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal.show{ display:flex; }

.modal-window{
    width:1300px;
    max-width:95vw;
    height:92vh;
    background:rgba(10,10,10,0.96);
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.modal-content{
    padding:40px;
    overflow:auto;
    color:white;
    display:flex;
    flex-direction:column;
    gap:30px;
}

/* REVIEW */

.review-header{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}

.poster{
    width:240px;
    border-radius:14px;
}

.big-title{
    font-size:60px;
    font-weight:900;
}

.meta{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.meta-box{
    padding:8px 12px;
    background:rgba(255,255,255,0.06);
    border-radius:10px;
}

.stars{
    color:#ffd95e;
    font-size:32px;
}

.review-text{
    line-height:1.8;
    background:rgba(255,255,255,0.05);
    padding:25px;
    border-radius:14px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.gallery img{
    width:100%;
    border-radius:12px;
}

/* ===== DOCK ===== */

.dock{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    padding:10px;
    background:rgba(0,0,0,0.5);
    border-radius:12px;
    backdrop-filter:blur(10px);
}

.dock-item{
    padding:8px 12px;
    color:white;
    background:rgba(255,255,255,0.08);
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

</style>
</head>

<body>

<div class="desktop">

    <!-- WINDOW 1 -->
    <div class="window" data-name="links">

        <div class="titlebar">
            <div>Mes Liens</div>
            <div class="controls">
                <div class="btn close"></div>
                <div class="btn min"></div>
                <div class="btn max"></div>
            </div>
        </div>

        <div class="content">

            <div class="links">
                <a class="link" href="#">Letterboxd</a>
                <a class="link" href="#">Backloggd</a>
                <a class="link" href="#">Twitch</a>
                <a class="link" href="#">YouTube</a>
                <a class="link" href="#">Discord</a>
                <a class="link" href="#">Docs</a>
            </div>

        </div>
    </div>

    <!-- WINDOW 2 -->
    <div class="window" data-name="reviews">

        <div class="titlebar">
            <div>Mes Critiques</div>
            <div class="controls">
                <div class="btn close"></div>
                <div class="btn min"></div>
                <div class="btn max"></div>
            </div>
        </div>

        <div class="content">

            <div class="review-card" onclick="openReview()">
                Magellan ★★★★☆
            </div>

        </div>
    </div>

</div>

<!-- MODAL FULL RESTAURÉ -->
<div class="modal" id="reviewModal">

    <div class="modal-window">

        <div class="titlebar">
            <div>Critique • Magellan</div>
            <div class="controls">
                <div class="btn close" onclick="closeReview()"></div>
            </div>
        </div>

        <div class="modal-content">

            <div class="review-header">

                <img class="poster" src="magellan-poster.jpg">

                <div>
                    <div class="big-title">Magellan</div>

                    <div class="meta">
                        <div class="meta-box">Lav Diaz</div>
                        <div class="meta-box">2h43</div>
                        <div class="meta-box">2025</div>
                    </div>

                    <div class="stars">★★★★☆</div>
                </div>

            </div>

            <div class="review-text">
                Mon premier Lav Diaz et j’ai adoré la manière dont les plans fixes...
            </div>

            <div class="gallery">
                <img src="magellan1.png">
                <img src="magellan2.png">
                <img src="magellan3.png">
                <img src="magellan4.png">
            </div>

        </div>

    </div>

</div>

<!-- DOCK -->
<div class="dock" id="dock"></div>

<script>

const windows = document.querySelectorAll(".window");
const dock = document.getElementById("dock");

/* STATE SYSTEM */
function updateDock(){
    dock.innerHTML = "";

    windows.forEach(win => {
        if(win.classList.contains("minimized")){
            const name = win.dataset.name;

            const item = document.createElement("div");
            item.className = "dock-item";
            item.textContent = name;

            item.onclick = () => {
                win.classList.remove("minimized");
            };

            dock.appendChild(item);
        }
    });
}

/* CONTROLS */
windows.forEach(win => {

    const closeBtn = win.querySelector(".close");
    const minBtn = win.querySelector(".min");
    const maxBtn = win.querySelector(".max");

    closeBtn.onclick = () => {
        win.classList.add("minimized");
        updateDock();
    };

    minBtn.onclick = () => {
        win.classList.toggle("minimized");
        updateDock();
    };

    maxBtn.onclick = () => {
        win.classList.toggle("maximized");
    };

});

/* MODAL */
const modal = document.getElementById("reviewModal");

function openReview(){
    modal.classList.add("show");
}

function closeReview(){
    modal.classList.remove("show");
}

updateDock();

</script>

</body>
</html>
