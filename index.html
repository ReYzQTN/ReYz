<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:url('background.jpg') center/cover no-repeat;
}

/* fond sombre */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* ===== BOUTON RÉOUVERTURE CENTRÉ ===== */
.open-app{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    padding:14px 18px;
    border-radius:14px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);

    color:white;
    cursor:pointer;

    backdrop-filter:blur(14px);
    text-align:center;

    display:none;
}

.open-app.show{
    display:block;
}

.open-app:hover{
    background:rgba(255,0,0,0.25);
}

/* ===== FENÊTRE GLASS ===== */
.window{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:440px;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:16px;

    box-shadow:0 25px 80px rgba(0,0,0,0.7);

    overflow:hidden;

    transition:0.25s ease;
}

/* maximisé */
.window.maximized{
    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    transform:none;

    border-radius:0;
}

/* minimisé */
.window.minimized{
    height:42px;
    overflow:hidden;
}

/* fermé */
.window.closed{
    display:none;
}

/* barre */
.titlebar{
    height:42px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);

    cursor:default;
    user-select:none;
}

.controls{
    display:flex;
    gap:8px;
}

/* ===== BOUTONS STYLE THÈME ===== */
.btn{
    width:11px;
    height:11px;
    border-radius:50%;

    cursor:pointer;

    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.18);

    backdrop-filter:blur(10px);

    transition:0.2s;
}

.btn:hover{
    transform:scale(1.2);
}

/* close */
.close:hover{
    background:rgba(255,80,80,0.25);
    border-color:rgba(255,80,80,0.6);
    box-shadow:0 0 12px rgba(255,0,0,0.35);
}

/* minimize */
.min:hover{
    background:rgba(255,190,80,0.20);
    border-color:rgba(255,190,80,0.5);
    box-shadow:0 0 10px rgba(255,180,80,0.25);
}

/* maximize */
.max:hover{
    background:rgba(80,255,140,0.18);
    border-color:rgba(80,255,140,0.5);
    box-shadow:0 0 10px rgba(80,255,140,0.25);
}

/* contenu */
.content{
    padding:22px;
    text-align:center;
    color:white;
}

.pp{
    width:110px;
    height:110px;
    border-radius:16px;
    object-fit:cover;
    margin-bottom:10px;
}

.name{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.link{
    text-decoration:none;
    color:white;

    padding:12px;
    border-radius:12px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(10px);

    transition:0.2s;
}

.link:hover{
    background:rgba(255,0,0,0.25);
    border-color:rgba(255,0,0,0.4);
    transform:scale(1.02);
}
</style>
</head>

<body>

<!-- bouton réouverture -->
<div class="open-app" id="openBtn" onclick="openWindow()">
    Cliquez ici pour faire réapparaître la fenêtre
</div>

<!-- fenêtre -->
<div class="window" id="window">

    <div class="titlebar">

        <div style="color:white;font-size:13px;font-weight:600;">
            Mes liens
        </div>

        <div class="controls">
            <div class="btn min" onclick="minimizeWindow()"></div>
            <div class="btn max" onclick="maximizeWindow()"></div>
            <div class="btn close" onclick="closeWindow()"></div>
        </div>

    </div>

    <div class="content">

        <img src="pp.jpg" class="pp">
        <div class="name">ReYz</div>

        <div class="links">
            <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
            <a class="link" href="https://www.twitch.tv/reyzqtn/" target="_blank">Twitch</a>
            <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
            <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>
        </div>

    </div>

</div>

<script>

const win = document.getElementById("window");
const openBtn = document.getElementById("openBtn");

/* ouvrir */
function openWindow(){
    win.classList.remove("closed");
    openBtn.classList.remove("show");
}

/* fermer */
function closeWindow(){
    win.classList.add("closed");
    openBtn.classList.add("show");
}

/* minimiser */
function minimizeWindow(){
    win.classList.toggle("minimized");
}

/* maximiser */
function maximizeWindow(){
    win.classList.toggle("maximized");
}

</script>

</body>
</html>
