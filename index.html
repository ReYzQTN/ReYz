<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:url('background.jpg') center/cover no-repeat;
}

/* fond sombre */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* bouton ouverture */
.open-app{
    position:absolute;
    top:20px;
    left:20px;

    padding:10px 14px;
    border-radius:12px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);

    color:white;
    cursor:pointer;

    backdrop-filter:blur(12px);
    transition:0.2s;
}

.open-app:hover{
    background:rgba(255,0,0,0.2);
}

/* ===== FENÊTRE GLASS ===== */
.window{
    position:absolute;

    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:440px;
    height:auto;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:16px;

    box-shadow:0 25px 80px rgba(0,0,0,0.7);

    overflow:hidden;

    transition:0.25s ease;
}

/* MODE MAXIMISÉ */
.window.maximized{
    top:0;
    left:0;
    transform:none;

    width:100%;
    height:100%;
    border-radius:0;
}

/* BARRE */
.titlebar{
    height:42px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.08);

    cursor:grab;

    user-select:none;
}

/* boutons style mac + glass */
.controls{
    display:flex;
    gap:8px;
}

.btn{
    width:12px;
    height:12px;
    border-radius:50%;

    cursor:pointer;

    transition:0.2s;
    opacity:0.9;
}

/* thème cohérent */
.close{ background:#ff5f57; }
.min{ background:#ffbd2e; }
.max{ background:#28c840; }

.btn:hover{
    transform:scale(1.2);
    opacity:1;
}

/* contenu */
.content{
    padding:22px;
    text-align:center;
    color:white;
}

.pp{
    width:110px;
    height:110px;
    border-radius:16px;
    object-fit:cover;
    margin-bottom:10px;
}

.name{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.link{
    text-decoration:none;
    color:white;

    padding:12px;
    border-radius:12px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(10px);

    transition:0.2s;
}

.link:hover{
    background:rgba(255,0,0,0.25);
    border-color:rgba(255,0,0,0.4);
    transform:scale(1.02);
}

/* états */
.window.minimized{
    height:42px;
    overflow:hidden;
}

.window.closed{
    display:none;
}
</style>
</head>

<body>

<!-- bouton ouverture -->
<div class="open-app" onclick="openWindow()">
    🌐 Mes liens
</div>

<!-- fenêtre -->
<div class="window" id="window">

    <div class="titlebar" id="dragbar">

        <div style="color:white;font-size:13px;font-weight:600;">
            Mes liens
        </div>

        <div class="controls">
            <div class="btn min" onclick="minimizeWindow()"></div>
            <div class="btn max" onclick="maximizeWindow()"></div>
            <div class="btn close" onclick="closeWindow()"></div>
        </div>

    </div>

    <div class="content">

        <img src="pp.jpg" class="pp">
        <div class="name">ReYz</div>

        <div class="links">
            <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
            <a class="link" href="https://www.twitch.tv/reyzqtn" target="_blank">Twitch</a>
            <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
            <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>
        </div>

    </div>

</div>

<script>

const win = document.getElementById("window");

/* ouvrir */
function openWindow(){
    win.classList.remove("closed");
}

/* fermer */
function closeWindow(){
    win.classList.add("closed");
}

/* minimiser */
function minimizeWindow(){
    win.classList.toggle("minimized");
}

/* maximiser / restaurer */
function maximizeWindow(){
    win.classList.toggle("maximized");
}

/* drag */
const dragbar = document.getElementById("dragbar");

let dragging = false;
let offsetX, offsetY;

dragbar.addEventListener("mousedown", (e) => {
    if(win.classList.contains("maximized")) return;

    dragging = true;

    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;

    dragbar.style.cursor = "grabbing";
});

document.addEventListener("mousemove", (e) => {
    if(!dragging) return;

    win.style.left = (e.clientX - offsetX) + "px";
    win.style.top = (e.clientY - offsetY) + "px";
    win.style.transform = "none";
});

document.addEventListener("mouseup", () => {
    dragging = false;
    dragbar.style.cursor = "grab";
});

</script>

</body>
</html>
