<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:url('background.jpg') center/cover no-repeat;
}

/* overlay */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.55)
    );
    z-index:0;
}

.container{
    position:relative;
    z-index:1;
    width:90%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}

.pp{
    width:140px;
    height:140px;
    border-radius:16px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.name{
    color:white;
    font-size:48px;
    font-weight:800;
    letter-spacing:2px;
    text-shadow:0 6px 18px rgba(0,0,0,0.6);
}

/* bouton onglet */
.tab-button{
    cursor:pointer;
    padding:14px 20px;
    border-radius:14px;
    background:rgba(0,0,0,0.5);
    border:1px solid rgba(255,255,255,0.15);
    color:white;
    font-size:18px;
    font-weight:bold;
    backdrop-filter:blur(10px);
    transition:0.25s;
}

.tab-button:hover{
    background:rgba(120,0,0,0.45);
    border-color:#ff0000;
    box-shadow:0 0 18px rgba(255,0,0,0.4);
}

/* zone liens */
.links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;

    max-height:500px;
    overflow:hidden;
    transition:0.4s ease;
}

/* fermé */
.links.hidden{
    max-height:0;
    opacity:0;
    transform:translateY(-10px);
    pointer-events:none;
}

.link{
    text-decoration:none;
    color:white;
    text-align:center;
    padding:18px;
    border-radius:16px;
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(255,0,0,0.15);
    backdrop-filter:blur(10px);
    font-size:20px;
    font-weight:bold;
    transition:0.25s;
}

.link:hover{
    transform:translateY(-3px) scale(1.02);
    background:rgba(120,0,0,0.45);
    border-color:#ff0000;
    box-shadow:0 0 18px rgba(255,0,0,0.4),
                0 0 40px rgba(255,0,0,0.2);
}

.footer{
    margin-top:8px;
    color:rgba(255,255,255,0.45);
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <img src="pp.jpg" class="pp">

    <div class="name">ReYz</div>

    <!-- ONGLET -->
    <div class="tab-button" onclick="toggleLinks()">
        Mes liens
    </div>

    <!-- LIENS -->
    <div class="links" id="links">
        <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
        <a class="link" href="https://www.twitch.tv/reyzqtn" target="_blank">Twitch</a>
        <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
        <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>
    </div>

    <div class="footer">ReYz ©</div>

</div>

<script>
function toggleLinks(){
    const links = document.getElementById("links");
    links.classList.toggle("hidden");
}
</script>

</body>
</html>
