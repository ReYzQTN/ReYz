<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReYz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url('background.jpg') center/cover no-repeat;
    overflow:hidden;
}

/* fond sombre */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* ===== FENÊTRE ===== */
.window{
    position:relative;
    z-index:2;

    width:90%;
    max-width:520px;

    background:rgba(20,20,20,0.75);
    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;

    box-shadow:0 20px 60px rgba(0,0,0,0.6);

    overflow:hidden;
}

/* barre du haut */
.titlebar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:10px 12px;
    background:rgba(0,0,0,0.6);

    border-bottom:1px solid rgba(255,255,255,0.08);
}

/* onglet style navigateur */
.tab{
    display:flex;
    align-items:center;
    gap:8px;

    padding:6px 10px;
    border-radius:8px;

    background:rgba(255,0,0,0.15);
    color:white;
    font-size:14px;
    font-weight:600;
}

/* boutons fenêtre */
.controls{
    display:flex;
    gap:8px;
}

.btn{
    width:12px;
    height:12px;
    border-radius:50%;
    cursor:pointer;
}

.close{ background:#ff4d4d; }
.min{ background:#ffbd44; }
.max{ background:#00ca56; }

/* contenu */
.content{
    padding:22px;
    text-align:center;
    color:white;
}

/* profil */
.pp{
    width:120px;
    height:120px;
    border-radius:16px;
    object-fit:cover;
    margin-bottom:12px;
}

.name{
    font-size:36px;
    font-weight:800;
    margin-bottom:18px;
}

/* bouton ouvrir fenêtre liens */
.open-btn{
    margin-top:10px;
    padding:12px 18px;
    border-radius:12px;

    border:none;
    cursor:pointer;

    background:rgba(255,0,0,0.2);
    color:white;
    font-weight:bold;

    transition:0.2s;
}

.open-btn:hover{
    background:rgba(255,0,0,0.4);
}

/* fenêtre liens (popup interne) */
.links-window{
    margin-top:15px;
    padding:12px;

    border-radius:12px;
    background:rgba(0,0,0,0.35);

    display:none;
    flex-direction:column;
    gap:10px;
}

.links-window.active{
    display:flex;
}

/* liens */
.link{
    text-decoration:none;
    color:white;

    padding:12px;
    border-radius:10px;

    background:rgba(0,0,0,0.4);
    border:1px solid rgba(255,0,0,0.15);

    transition:0.2s;
}

.link:hover{
    background:rgba(120,0,0,0.45);
    border-color:red;
    transform:scale(1.02);
}

/* fermeture fenêtre */
.window.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="window" id="appWindow">

    <!-- BARRE TYPE APP / NAVIGATEUR -->
    <div class="titlebar">

        <div class="tab">🌐 Mes liens</div>

        <div class="controls">
            <div class="btn min"></div>
            <div class="btn max"></div>
            <div class="btn close" onclick="closeWindow()"></div>
        </div>

    </div>

    <!-- CONTENU -->
    <div class="content">

        <img src="pp.jpg" class="pp">

        <div class="name">ReYz</div>

        <button class="open-btn" onclick="toggleLinks()">
            Ouvrir les liens
        </button>

        <!-- "SOUS-FENÊTRE" LIENS -->
        <div class="links-window" id="links">

            <a class="link" href="https://letterboxd.com/reyzqtn/" target="_blank">Letterboxd</a>
            <a class="link" href="https://www.twitch.tv/reyzqtn" target="_blank">Twitch</a>
            <a class="link" href="https://discord.gg/HTXMsQTzQ7" target="_blank">Discord</a>
            <a class="link" href="https://docs.google.com/spreadsheets/d/1egwAp5F1hMdvSqRqc1NFNeV6fZbJHpul8cFs1tXH9pc" target="_blank">Google Doc</a>

        </div>

    </div>

</div>

<script>
function toggleLinks(){
    document.getElementById("links").classList.toggle("active");
}

function closeWindow(){
    document.getElementById("appWindow").classList.add("hidden");
}
</script>

</body>
</html>
